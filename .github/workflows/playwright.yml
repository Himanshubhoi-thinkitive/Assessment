name: Playwright Session Automation Tests

on:
  push:
    branches: [session-automation, main, master]
  pull_request:
    branches: [session-automation, main, master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Specific test path (optional)'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_BROWSERS_PATH: 0

jobs:
  lint-and-validate:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Playwright config
        run: npx playwright test --list

      - name: Check for test files
        run: |
          if [ -z "$(find tests -name '*.spec.ts' -o -name '*.spec.js' -o -name '*.test.ts' -o -name '*.test.js')" ]; then
            echo "Warning: No test files found in tests directory"
            ls -la tests/
          else
            echo "Test files found:"
            find tests -name '*.spec.ts' -o -name '*.spec.js' -o -name '*.test.ts' -o -name '*.test.js'
          fi

  test:
    name: Chromium Tests
    needs: lint-and-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }} ${{ github.event.inputs.test_path }}
        env:
          CI: true
          PWTEST_SKIP_TEST_OUTPUT: 1

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-artifacts-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
            blob-report/
          retention-days: 7

  merge-reports:
    name: Merge Chromium Reports
    if: always()
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: chromium-artifacts-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/session-automation' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: reports/${{ github.run_number }}

  notify:
    name: Notification
    if: always()
    needs: [test, merge-reports]
    runs-on: ubuntu-latest

    steps:
      - name: Create test summary
        run: |
          echo "## Test Results Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Report Merge | ${{ needs.merge-reports.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View detailed report](https://himanshubhoi-thinkitive.github.io/Assessment/reports/${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const reportUrl = `https://himanshubhoi-thinkitive.github.io/Assessment/reports/${context.runNumber}`;

            const body = `## 🎭 Playwright Chromium Test Results
            
            **Run Status:** ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }}
            
            | Test Suite | Status |
            |------------|--------|
            | Chromium Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} ${{ needs.test.result }} |
            
            📊 [View Full Report](${reportUrl})
            🔗 [GitHub Actions Run](${runUrl})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

